name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3
          bundler-cache: true

      - name: Build site
        run: |
          bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
          if [ -n "$PROTECTOR_PASSWORD" ]; then
            # Scan all built HTML files for common Chirpy layout elements or specific filenames
            find _site -name "*.html" -type f | while read -r file; do
              # Alternative: If you know the exact file name, you can target it directly
              if grep -q 'class="post"' "$file" || grep -q 'id="post-wrapper"' "$file"; then
                echo "Encrypting matching target file: $file"
                npx staticrypt "$file" -p "$PROTECTOR_PASSWORD" -o "$file"
              fi
            done
          fi
        env:
          JEKYLL_ENV: "production"
          PROTECTOR_PASSWORD: ${{ secrets.PROTECTOR_PASSWORD }}

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external=true \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
