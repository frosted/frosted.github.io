name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3
          bundler-cache: true

      - name: Build site
        run: |
          set -euo pipefail

          OUT_DIR="_site${{ steps.pages.outputs.base_path }}"
          echo "Building Jekyll output to: $OUT_DIR"
          bundle exec jekyll b -d "$OUT_DIR"

          if [ -z "${PROTECTOR_PASSWORD:-}" ]; then
            echo "PROTECTOR_PASSWORD is empty; skipping encryption"
            exit 0
          fi

          echo "Scanning built HTML for encryption marker..."
          FOUND=0
          while IFS= read -r -d '' file; do
            if grep -q "encrypted: true" "$file"; then
              echo "Encrypting: $file"
              npx --yes staticrypt "$file" -p "$PROTECTOR_PASSWORD" -o "$file"
              FOUND=1
            fi
          done < <(find "$OUT_DIR" -name "*.html" -type f -print0)

          if [ "$FOUND" -eq 0 ]; then
            echo "No built HTML files contained marker: encrypted: true"
            exit 1
          fi

          # PWA cache-control: force SW refresh and keep protected page out of precache.
          if [ -f "$OUT_DIR/sw.js" ]; then
            echo "// cache-bust:${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}" >> "$OUT_DIR/sw.js"
          fi

          SWCACHE_FILE="$OUT_DIR/assets/js/data/swcache.js"
          if [ -f "$SWCACHE_FILE" ]; then
            sed -i '\|/posts/journal-and-reflection/|d' "$SWCACHE_FILE"
            sed -i '\|/posts/journal-and-reflection/index.html|d' "$SWCACHE_FILE"
          fi
        env:
          JEKYLL_ENV: "production"
          PROTECTOR_PASSWORD: ${{ secrets.PROTECTOR_PASSWORD }}

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external=true \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
