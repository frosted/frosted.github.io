name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3
          bundler-cache: true

      - name: Build site
        run: |
          set -euo pipefail

          OUT_DIR="_site${{ steps.pages.outputs.base_path }}"
          echo "Building Jekyll output to: $OUT_DIR"
          bundle exec jekyll b -d "$OUT_DIR"

          if [ -z "${PROTECTOR_PASSWORD:-}" ]; then
            echo "PROTECTOR_PASSWORD is empty; skipping encryption"
            exit 0
          fi

          echo "Discovering protected posts from source front matter..."
          mapfile -t PROTECTED_SLUGS < <(
            for src in _posts/*.md; do
              [ -f "$src" ] || continue

              if awk '
                BEGIN { in_fm=0; seen_start=0; enc=0 }
                NR==1 && $0 ~ /^---[[:space:]]*$/ { in_fm=1; seen_start=1; next }
                in_fm && $0 ~ /^---[[:space:]]*$/ { exit(enc ? 0 : 1) }
                in_fm && $0 ~ /^[[:space:]]*encrypted:[[:space:]]*true([[:space:]]*#.*)?$/ { enc=1 }
                END { if (!seen_start) exit 1 }
              ' "$src"; then
                name="$(basename "$src")"
                slug="${name%.md}"
                slug="${slug#????-??-??-}"
                printf '%s\n' "$slug"
              fi
            done
          )

          if [ "${#PROTECTED_SLUGS[@]}" -eq 0 ]; then
            echo "No posts found with front matter 'encrypted: true'"
            exit 1
          fi

          for slug in "${PROTECTED_SLUGS[@]}"; do
            target="$OUT_DIR/posts/$slug/index.html"
            if [ ! -f "$target" ]; then
              echo "Expected built file missing for encrypted post: $target"
              exit 1
            fi

            echo "Encrypting: $target"
            tmp_out="$target.staticrypt.tmp.html"
            npx --yes staticrypt@3 "$target" -p "$PROTECTOR_PASSWORD" -o "$tmp_out"
            mv "$tmp_out" "$target"

            # Verify output was transformed by staticrypt before upload.
            if ! grep -Eiq "staticrypt|decrypt" "$target"; then
              echo "Staticrypt verification failed for: $target"
              exit 1
            fi
          done

          # PWA cache-control: force SW refresh and keep protected page out of precache.
          if [ -f "$OUT_DIR/sw.js" ]; then
            echo "// cache-bust:${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}" >> "$OUT_DIR/sw.js"
          fi

          SWCACHE_FILE="$OUT_DIR/assets/js/data/swcache.js"
          if [ -f "$SWCACHE_FILE" ]; then
            for slug in "${PROTECTED_SLUGS[@]}"; do
              sed -i "\\|/posts/$slug/|d" "$SWCACHE_FILE"
              sed -i "\\|/posts/$slug/index.html|d" "$SWCACHE_FILE"
            done
          fi
        env:
          JEKYLL_ENV: "production"
          PROTECTOR_PASSWORD: ${{ secrets.PROTECTOR_PASSWORD }}

      - name: Test site
        run: |
          bundle exec htmlproofer "_site${{ steps.pages.outputs.base_path }}" \
            \-\-disable-external=true \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
