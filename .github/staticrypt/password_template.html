<!doctype html>
<html class="staticrypt-html" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>/*[|template_title|]*/0</title>

    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />

    <style>
      :root {
        --bg-0: #0b1020;
        --bg-1: #111a2f;
        --bg-2: #17233d;
        --card: #141c31;
        --border: #2a3657;
        --text: #e9eefc;
        --muted: #9fb0d7;
        --accent: #4da3ff;
        --accent-2: #1b7be0;
        --danger: #ff8181;
        --ring: rgba(77, 163, 255, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      .staticrypt-html,
      .staticrypt-body {
        margin: 0;
        min-height: 100%;
      }

      .staticrypt-content {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(1200px 500px at 10% -10%, #243964 0%, transparent 60%),
          radial-gradient(800px 500px at 100% 0%, #1d335f 0%, transparent 60%),
          linear-gradient(140deg, var(--bg-0), var(--bg-1) 40%, var(--bg-2));
        font-family: "Segoe UI", "Inter", "Noto Sans", sans-serif;
        color: var(--text);
        padding: 24px;
      }

      .staticrypt-page {
        width: 100%;
        max-width: 440px;
      }

      .staticrypt-form {
        border: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
        backdrop-filter: blur(4px);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      .staticrypt-kicker {
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 12px;
      }

      .staticrypt-title {
        margin: 0;
        font-size: 1.55rem;
        line-height: 1.2;
      }

      .staticrypt-help {
        margin: 10px 0 0;
        color: var(--muted);
        line-height: 1.55;
      }

      .staticrypt-hr {
        margin: 18px 0;
        border: none;
        border-top: 1px solid var(--border);
      }

      #staticrypt-password {
        width: 100%;
        background: #0c1426;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 15px;
        outline: none;
      }

      #staticrypt-password:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px var(--ring);
      }

      #staticrypt-password::placeholder {
        color: #7f92bc;
      }

      .staticrypt-decrypt-button {
        margin-top: 14px;
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.03em;
        color: #fff;
        background: linear-gradient(180deg, var(--accent), var(--accent-2));
        cursor: pointer;
      }

      .staticrypt-decrypt-button:hover {
        filter: brightness(1.06);
      }

      .staticrypt-decrypt-button:active {
        transform: translateY(1px);
      }

      .staticrypt-remember {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .staticrypt-remember input {
        width: 16px;
        height: 16px;
      }

      .hidden {
        display: none !important;
      }

      .staticrypt-spinner-container {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(140deg, var(--bg-0), var(--bg-1) 40%, var(--bg-2));
      }

      .staticrypt-spinner {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: #fff;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 520px) {
        .staticrypt-form {
          padding: 22px;
          border-radius: 14px;
        }
      }
    </style>
  </head>
  <body class="staticrypt-body">
    <div id="staticrypt_loading" class="staticrypt-spinner-container">
      <div class="staticrypt-spinner"></div>
    </div>

    <div id="staticrypt_content" class="staticrypt-content hidden">
      <div class="staticrypt-page">
        <div class="staticrypt-form">
          <p class="staticrypt-kicker">Protected Post</p>
          <h1 class="staticrypt-title">/*[|template_title|]*/0</h1>
          <p class="staticrypt-help">/*[|template_instructions|]*/0</p>

          <hr class="staticrypt-hr" />

          <form id="staticrypt-form" action="#" method="post">
            <input
              id="staticrypt-password"
              type="password"
              name="password"
              placeholder="/*[|template_placeholder|]*/0"
              autofocus
            />

            <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
              <input id="staticrypt-remember" type="checkbox" name="remember" />
              /*[|template_remember|]*/0
            </label>

            <input type="submit" class="staticrypt-decrypt-button" value="/*[|template_button|]*/0" />
          </form>
        </div>
      </div>
    </div>

    <script>
      const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
      const templateError = "/*[|template_error|]*/0";
      const isRememberEnabled = /*[|is_remember_enabled|]*/ 0;
      const staticryptConfig = /*[|staticrypt_config|]*/ 0;

      const templateConfig = {
        rememberExpirationKey: "staticrypt_expiration",
        rememberPassphraseKey: "staticrypt_passphrase",
        replaceHtmlCallback: null,
        clearLocalStorageCallback: null,
      };

      const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

      window.onload = async function () {
        const result = await staticrypt.handleDecryptOnLoad();

        if (!result.isSuccessful) {
          document.getElementById("staticrypt_loading").classList.add("hidden");
          document.getElementById("staticrypt_content").classList.remove("hidden");
          document.getElementById("staticrypt-password").focus();

          if (isRememberEnabled) {
            document.getElementById("staticrypt-remember-label").classList.remove("hidden");
          }
        }
      };

      document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
        e.preventDefault();

        const password = document.getElementById("staticrypt-password").value;
        const isRememberChecked = document.getElementById("staticrypt-remember").checked;

        const result = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

        if (!result.isSuccessful) {
          alert(templateError);
        }
      });
    </script>
  </body>
</html>
