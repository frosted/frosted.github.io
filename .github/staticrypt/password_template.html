<!doctype html>
<html class="staticrypt-html" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>/*[|template_title|]*/0</title>

    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />

    <script>
      (function () {
        try {
          var mode = localStorage.getItem("mode") || localStorage.getItem("theme") || localStorage.getItem("data-mode");
          if (mode === "light" || mode === "dark") {
            document.documentElement.setAttribute("data-mode", mode);
          }
        } catch (e) {
          /* no-op */
        }
      })();
    </script>

    <style>
      :root {
        /* Chirpy light tokens from live site */
        --bg-0: #ffffff;
        --bg-1: #f6f8fa;
        --bg-2: #eef2f6;
        --card: #ffffff;
        --card-strong: #fdfdff;
        --border: #e9ecef;
        --text: #34343c;
        --muted: #757575;
        --heading: #2a2a2a;
        --accent: #0056b2;
        --accent-strong: #0d6efd;
        --ring: rgba(0, 86, 178, 0.22);
        --shadow: rgba(104, 104, 104, 0.11);
        --kbd-bg: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          /* Chirpy dark tokens from live site */
          --bg-0: rgb(27, 27, 30);
          --bg-1: #1e1e1e;
          --bg-2: #232328;
          --card: #1e1e1e;
          --card-strong: #292929;
          --border: #2e2f31;
          --text: rgb(175, 176, 177);
          --muted: #868686;
          --heading: #cccccc;
          --accent: rgb(138, 180, 248);
          --accent-strong: rgb(116, 178, 243);
          --ring: rgba(138, 180, 248, 0.28);
          --shadow: rgba(21, 21, 21, 0.72);
          --kbd-bg: #242424;
        }
      }

      /* Optional explicit mode override if you ever set it manually on html */
      .staticrypt-html[data-mode="light"] {
        --bg-0: #ffffff;
        --bg-1: #f6f8fa;
        --bg-2: #eef2f6;
        --card: #ffffff;
        --card-strong: #fdfdff;
        --border: #e9ecef;
        --text: #34343c;
        --muted: #757575;
        --heading: #2a2a2a;
        --accent: #0056b2;
        --accent-strong: #0d6efd;
        --ring: rgba(0, 86, 178, 0.22);
        --shadow: rgba(104, 104, 104, 0.11);
      }

      .staticrypt-html[data-mode="dark"] {
        --bg-0: rgb(27, 27, 30);
        --bg-1: #1e1e1e;
        --bg-2: #232328;
        --card: #1e1e1e;
        --card-strong: #292929;
        --border: #2e2f31;
        --text: rgb(175, 176, 177);
        --muted: #868686;
        --heading: #cccccc;
        --accent: rgb(138, 180, 248);
        --accent-strong: rgb(116, 178, 243);
        --ring: rgba(138, 180, 248, 0.28);
        --shadow: rgba(21, 21, 21, 0.72);
      }

      * {
        box-sizing: border-box;
      }

      .staticrypt-html,
      .staticrypt-body {
        margin: 0;
        min-height: 100%;
      }

      .staticrypt-content {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(980px 420px at -12% -8%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 62%),
          radial-gradient(760px 380px at 110% -8%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 60%),
          linear-gradient(155deg, var(--bg-0), var(--bg-1) 42%, var(--bg-2));
        font-family: "Source Sans Pro", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        color: var(--text);
        font-size: 16px;
        line-height: 1.75;
        padding: 24px;
      }

      .staticrypt-page {
        width: 100%;
        max-width: 520px;
      }

      .staticrypt-form {
        border: 1px solid var(--border);
        border-top: 3px solid var(--accent);
        background: linear-gradient(180deg, var(--card), var(--card-strong));
        border-radius: 0.85rem;
        padding: 1.7rem 1.6rem;
        box-shadow: 0 14px 44px var(--shadow);
      }

      .staticrypt-kicker {
        margin: 0 0 0.35rem;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .staticrypt-title {
        margin: 0;
        color: var(--heading);
        font-family: Lato, "Source Sans Pro", "Segoe UI", sans-serif;
        font-weight: 400;
        font-size: 1.5rem;
        line-height: 1.35;
        letter-spacing: 0.01em;
      }

      .staticrypt-help {
        margin: 0.55rem 0 0;
        color: var(--muted);
        font-size: 0.99rem;
        line-height: 1.7;
      }

      .staticrypt-hr {
        margin: 1.05rem 0 1.05rem;
        border: none;
        border-top: 1px dashed var(--border);
      }

      #staticrypt-password {
        width: 100%;
        background: var(--kbd-bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.65rem;
        padding: 0.7rem 0.8rem;
        font-family: inherit;
        font-size: 1rem;
        line-height: 1.45;
        outline: none;
        transition: box-shadow 0.15s ease, border-color 0.15s ease;
      }

      #staticrypt-password:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 0.24rem var(--ring);
      }

      #staticrypt-password::placeholder {
        color: var(--muted);
      }

      .staticrypt-decrypt-button {
        margin-top: 0.85rem;
        width: 100%;
        border: 1px solid var(--accent-strong);
        border-radius: 0.65rem;
        padding: 0.72rem 0.82rem;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #fff;
        background: linear-gradient(180deg, var(--accent), var(--accent-strong));
        cursor: pointer;
        transition: filter 0.15s ease, transform 0.08s ease;
      }

      .staticrypt-decrypt-button:hover {
        filter: brightness(1.045);
      }

      .staticrypt-decrypt-button:active {
        transform: translateY(1px);
      }

      .staticrypt-remember {
        margin-top: 0.72rem;
        display: flex;
        align-items: center;
        gap: 0.55rem;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .staticrypt-remember input {
        width: 0.95rem;
        height: 0.95rem;
        accent-color: var(--accent);
      }

      .hidden {
        display: none !important;
      }

      .staticrypt-spinner-container {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(155deg, var(--bg-0), var(--bg-1) 42%, var(--bg-2));
      }

      .staticrypt-spinner {
        width: 2.25rem;
        height: 2.25rem;
        border-radius: 50%;
        border: 0.22rem solid rgba(127, 146, 188, 0.3);
        border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 560px) {
        .staticrypt-content {
          padding: 18px;
        }

        .staticrypt-form {
          padding: 1.2rem 1.05rem;
          border-radius: 0.75rem;
        }

        .staticrypt-title {
          font-size: 1.34rem;
        }
      }
    </style>
  </head>
  <body class="staticrypt-body">
    <div id="staticrypt_loading" class="staticrypt-spinner-container">
      <div class="staticrypt-spinner"></div>
    </div>

    <div id="staticrypt_content" class="staticrypt-content hidden">
      <div class="staticrypt-page">
        <div class="staticrypt-form">
          <p class="staticrypt-kicker">Protected Post</p>
          <h1 class="staticrypt-title">/*[|template_title|]*/0</h1>
          <p class="staticrypt-help">/*[|template_instructions|]*/0</p>

          <hr class="staticrypt-hr" />

          <form id="staticrypt-form" action="#" method="post">
            <input
              id="staticrypt-password"
              type="password"
              name="password"
              placeholder="/*[|template_placeholder|]*/0"
              autofocus
            />

            <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
              <input id="staticrypt-remember" type="checkbox" name="remember" />
              /*[|template_remember|]*/0
            </label>

            <input type="submit" class="staticrypt-decrypt-button" value="/*[|template_button|]*/0" />
          </form>
        </div>
      </div>
    </div>

    <script>
      const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
      const templateError = "/*[|template_error|]*/0";
      const isRememberEnabled = /*[|is_remember_enabled|]*/ 0;
      const staticryptConfig = /*[|staticrypt_config|]*/ 0;

      const templateConfig = {
        rememberExpirationKey: "staticrypt_expiration",
        rememberPassphraseKey: "staticrypt_passphrase",
        replaceHtmlCallback: null,
        clearLocalStorageCallback: null,
      };

      const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

      window.onload = async function () {
        const result = await staticrypt.handleDecryptOnLoad();

        if (!result.isSuccessful) {
          document.getElementById("staticrypt_loading").classList.add("hidden");
          document.getElementById("staticrypt_content").classList.remove("hidden");
          document.getElementById("staticrypt-password").focus();

          if (isRememberEnabled) {
            document.getElementById("staticrypt-remember-label").classList.remove("hidden");
          }
        }
      };

      document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
        e.preventDefault();

        const password = document.getElementById("staticrypt-password").value;
        const isRememberChecked = document.getElementById("staticrypt-remember").checked;

        const result = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

        if (!result.isSuccessful) {
          alert(templateError);
        }
      });
    </script>
  </body>
</html>
